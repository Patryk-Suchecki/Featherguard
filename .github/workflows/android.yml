name: Android build

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: List the LFS files the game needs
        run: git lfs ls-files --long --include="Assets/**" | cut -d ' ' -f1 | sort > .lfs-assets-id

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull the LFS files the game needs
        run: git lfs pull --include="Assets/**"

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          buildName: Featherguard
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: Featherguard-${{ github.run_number }}
          path: build/Android
          retention-days: 30
